<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">MARFIN</title>
     <link rel="stylesheet" href="player.css">
</head>
<body>
    <canvas id="visualizer"></canvas>
    <div class="hero-section">
    <header>
        <div class="header-container">
         <svg class="ui-neon-svg header-neon-svg" xmlns="http://www.w3.org/2000/svg">
            <path class="ui-neon-path header-neon-path path-1" />
            <path class="ui-neon-path header-neon-path path-2" />
        </svg>   
        <h2 class="brand">MARFIN</h2>
        <div class="navigation-container">
       <nav>
            <a href="#lyrics">Lyrics</a>
            <a href="#about">About</a>
        <div class="header-menu-container">
           <button id="tracklist-toggle" class="cyber-btn-tracks">
            <svg class="cyber-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square">
                <line x1="8" y1="6" x2="21" y2="6"></line>
                <line x1="8" y1="12" x2="21" y2="12"></line>
                <line x1="8" y1="18" x2="21" y2="18"></line>
                <rect x="3" y="5" width="2" height="2" fill="currentColor" stroke="none"></rect>
                <rect x="3" y="11" width="2" height="2" fill="currentColor" stroke="none"></rect>
                <rect x="3" y="17" width="2" height="2" fill="currentColor" stroke="none"></rect>
            </svg>
            <span class="btn-text">TRACKS</span>
            </button>
            <div id="tracklist-dropdown" class="cyber-dropdown">
                <div class="dropdown-header">//SELECT_TRACK_CORE</div>
                <div class="search-box">
                    <input type="text" id="input-search" placeholder="Search...">
                </div>
                <div class="category-filters">
                    <button class="filter-btn active" data-category="all">All</button>
                    <button class="filter-btn" data-category="album">Albums</button>
                    <button class="filter-btn" data-category="single">Singles</button>
                    <button class="filter-btn" data-category="feat">Feats</button>
                </div>
                <ul id="tracks-vector-list" class="tracks-vector-list"></ul>
        </div>
        </div>
        </nav>
        </div>
        </div>
    </header>
    <section class="hero-gradient">
        <div class="page-container">
            <svg class="ui-neon-svg hero-neon-svg" xmlns="http://www.w3.org/2000/svg">
                <path class="ui-neon-path hero-neon-path path-1" />
                <path class="ui-neon-path hero-neon-path path-2" />
            </svg>
            <div class="image">
        <img id="cover-img" src="" alt="">
        </div>
        <div class="song-info">
            <div class="titles-block">
            <h1 id="song-title"></h1>
            <p class="band-name" id="band-name"></p>
            </div>
            <div class="producers-block">
                <p class="label">Producers</p>
                <p class="names" id="producers-names"></p>
            </div>
            <audio controls id="audio">
                <source id="audio-source" src="" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
            <div class="player-frame">
            <div class="custom-player">
                <div class="tech-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
                <div class="player-controls">
                    <button id="play-pause-btn" class="control-btn" aria-label="Play/Pause">
                        <svg id="icon-play" viewBox="0 0 24 24" width="24" height="24"> 
                            <path d="M8 5v14l11-7z" fill="#ff0055"/>
                        </svg> 
                        <svg id="icon-pause" viewBox="0 0 24 24" width="24" height="24" style="display: none;">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="#ff0055"/>
                        </svg>
                    </button>
            </div>
            <div class="volume-control">
                <button id="volume-toggle" class="volume-icon-btn">
                    <svg viewBox="0 0 24 24" width="18" height="18"> 
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" fill="#ff0055"/> 
                    </svg>
                </button>
                <div class="volume-steps">
                    <span class="vol-bar active" data-level="0.2"></span>
                    <span class="vol-bar active" data-level="0.4"></span>
                    <span class="vol-bar active" data-level="0.6"></span>
                    <span class="vol-bar" data-level="0.8"></span>
                    <span class="vol-bar" data-level="1"></span>
                </div>
            </div>
            <div class="timeline-container">
                <span class="time-display time-current" id="time-current">00:00</span>
                <div class="progress-bar" id="progress-bar">
                    <div class="progress-filled" id="progress-filled"></div>
                </div>
                <span class="time-display time-total" id="time-total">00:00</span>
                <div class="micro-equalizer">
                    <span class="eq-bar" style="--h: 8px;"></span>
                    <span class="eq-bar" style="--h: 12px;"></span>
                    <span class="eq-bar" style="--h: 16px;"></span>
                    <span class="eq-bar" style="--h: 20px;"></span>
                </div>
            </div>
            </div>
            </div>
            <div class="release-date">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-calendar-days-icon lucide-calendar-days">
                <path d="M8 2v4"/>
                <path d="M16 2v4"/>
                <rect width="18" height="18" x="3" y="4" rx="2"/>
                <path d="M3 10h18"/>
                <path d="M8 14h.01"/>
                <path d="M12 14h.01"/>
                <path d="M16 14h.01"/>
                <path d="M8 18h.01"/>
                <path d="M12 18h.01"/>
                <path d="M16 18h.01"/>
                </svg>
                <span id="release-date-text"></span>
                <a id="download-link" href="#" class="cyber-download-btn" title="Скачать трек">
                    <svg class="download-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 3v13" />
                        <path d="M7 11l5 5 5-5" />
                        <path d="M4 20h16" />
                    </svg>
                </a>
            </div>
        </div>
        </div>
        </section>
        </div>
    <main>
        <section id="lyrics">
            <h2 class="lyrics-heading" id="lyrics-heading"></h2>
            <br>
            <div class="lyrics-container" id="lyrics-container"></div>
        </section>
        </main>
        <section id="about" class="about-song">
            <svg class="about-song-neon-svg" xmlns="http://www.w3.org/2000/svg">
                <path class="about-song-neon-path path-1" />
                <path class="about-song-neon-path path-2" />
            </svg>
                <h2 class="about-song-title">About</h2>
            <div class="about-song-container">
            <p class="about-song-subtitle" id="about-subtitle">Song bio</p>
            <div id="about-paragraphs"></div>
    </div>
    </section>
    <footer>
        <svg class="ui-neon-svg footer-neon-svg" xmlns="http://www.w3.org/2000/svg">
            <path class="ui-neon-path footer-neon-path path-1" />
            <path class="ui-neon-path footer-neon-path path-2" />
        </svg>
        <p>&copy; 2026 MARFIN. All right reserved.</p>
    </footer>
    <script src="tracks.js"></script>
    <script src="player.js"></script>
</body>
</html>
